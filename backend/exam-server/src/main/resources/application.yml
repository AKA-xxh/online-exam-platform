server:
  port: 8080

spring:
  application:
    name: exam-platform
  profiles:
    active: dev

  # Jackson 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # 404 异常处理
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.exam.module.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Sa-Token 认证配置
sa-token:
  token-name: Authorization
  timeout: 7200           # Token 有效期 2 小时
  active-timeout: 1800    # 30 分钟无操作自动失效
  is-concurrent: true     # 允许同一账号并发登录
  is-share: false         # 每次登录生成新 Token
  token-style: uuid       # Token 风格
  token-prefix: Bearer    # 自动剥离请求头中 Bearer 前缀
  is-log: true            # 是否输出操作日志

# Knife4j API 文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    root: info
    com.exam: debug
    org.springframework.security: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
